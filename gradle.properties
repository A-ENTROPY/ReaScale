# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.incremental=true

# NDK
android.ndkVersion=27.0.12077973

# 使用 build-tools 自带 aapt2（修复 AGP 8.5 在 Linux aarch64 启动 maven aapt2 失败）
android.aapt2FromMavenOverride=C:/Users/AMDDMA/AppData/Local/Android/Sdk/build-tools/36.0.0/aapt2.exe

# 抑制 compileSdk=36 警告（avif-coder 要求 minCompileSdk 36，AGP 8.5.2 未官方支持 36）
android.suppressUnsupportedCompileSdk=36

# 镜像源（让 Gradle 内部 HTTP 客户端走阿里云）
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000